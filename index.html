<script>
const STORAGE_KEY='fc26-tournament-v1';const emptyTournament=(name,years)=>({name,years,participants:[],groups:{A:[],B:[],C:[]},groupMatches:[],leagueMatches:[],final:{teams:[],games:[]},champion:null});const defaultData={t1:emptyTournament('Torneo 1',['1° Año','2° Año','3° Año']),t2:emptyTournament('Torneo 2',['4° Año','5° Año','6° Año'])};let data=loadData(),isAdmin=sessionStorage.getItem('fc26-admin')==='1',currentTournament='t1',publicPhase='groups',adminSection='overview',editingId=null,pendingImage='';function loadData(){try{return {...defaultData,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch{return defaultData}}function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function uid(){return'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function current(){return data[currentTournament]}function participant(id){return current().participants.find(p=>p.id===id)}function crest(p){return p&&p.image?`<img class="crest" src="${p.image}" alt="Escudo de ${esc(p.club)}">`:'<span class="crest empty">+</span>'}function stats(t,id){let s={pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0};t.groupMatches.filter(m=>m.a===id||m.b===id).forEach(m=>{if(m.status==='pending')return;let home=m.a===id,gf=home?m.ga:m.gb,gc=home?m.gb:m.ga;s.pj++;s.gf+=gf;s.gc+=gc;if(gf>gc){s.pg++;s.pts+=3}else if(gf===gc){s.pe++;s.pts++}else s.pp++});s.dg=s.gf-s.gc;return s}function groupParticipants(t,key){return t.groups[key].map(id=>participant(id)).filter(Boolean).sort((a,b)=>{let x=stats(t,a.id),y=stats(t,b.id);return y.pts-x.pts||y.dg-x.dg||y.gf-x.gf})}function allMatches(t){return[...t.groupMatches,...t.leagueMatches,...(t.final.games||[])]}function show(view){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==view+'View'));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='home')renderHome();if(view==='tournaments')renderPublic();if(view==='admin')renderAdmin()}function renderHome(){document.getElementById('roleLabel').textContent=isAdmin?'MODO ADMINISTRADOR':'MODO VISITANTE';let teams=data.t1.participants.length+data.t2.participants.length;document.getElementById('homeTeams').textContent=teams;document.getElementById('homeMatches').textContent=allMatches(data.t1).concat(allMatches(data.t2)).filter(m=>m.status==='played').length;document.getElementById('homeChampions').textContent=[data.t1.champion,data.t2.champion].filter(Boolean).length}function publicTabs(){return`<div class="tabs"><button class="tab ${publicPhase==='groups'?'active':''}" data-phase="groups">Fase 1 · Grupos</button><button class="tab ${publicPhase==='league'?'active':''}" data-phase="league">Fase 2 · Mini Liga</button><button class="tab ${publicPhase==='final'?'active':''}" data-phase="final">Final</button></div>`}function renderPublic(){let t=current();document.getElementById('publicTitle').textContent=t.name;document.getElementById('publicContent').innerHTML=`<div class="tabs"><button class="tab ${currentTournament==='t1'?'active':''}" data-tourney="t1">Torneo 1 · 1° a 3°</button><button class="tab ${currentTournament==='t2'?'active':''}" data-tourney="t2">Torneo 2 · 4° a 6°</button></div>${publicTabs()}<div id="publicPhaseContent">${publicPhase==='groups'?renderGroups(t):publicPhase==='league'?renderLeague(t):renderFinal(t)}</div>`;bindPublic()}function renderGroups(t){if(!t.participants.length)return`<div class="empty"><strong>Participantes por definir</strong>El administrador todavía no cargó duplas para este torneo.</div>`;return`<div class="tournament-grid">${['A','B','C'].map(g=>`<div class="panel"><div class="panel-head"><h2>Tabla ${g}</h2><span class="badge">${groupParticipants(t,g).length} equipos</span></div>${tableHtml(t,groupParticipants(t,g))}</div>`).join('')}</div><div class="panel" style="margin-top:18px"><div class="panel-head"><h2>Resultados de grupos</h2><span class="muted">Victoria 3 · Empate 1 · Derrota 0</span></div>${matchesHtml(t,t.groupMatches)}</div>`}function tableHtml(t,items){if(!items.length)return'<div class="empty">Sin participantes asignados.</div>';return`<div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>${items.map((p,i)=>{let s=stats(t,p.id);return`<tr><td class="${i===0?'qualify':''}">${i+1}</td><td><div class="team-cell">${crest(p)}<span><b>${esc(p.name)}</b><small class="muted">${esc(p.course)} ${p.division?'· '+esc(p.division):''} · ${esc(p.club)||'Club pendiente'}</small></span></div></td><td>${s.pj}</td><td>${s.pg}</td><td>${s.pe}</td><td>${s.pp}</td><td>${s.gf}</td><td>${s.gc}</td><td>${s.dg}</td><td><b>${s.pts}</b></td></tr>`}).join('')}</tbody></table></div>`}function matchesHtml(t,matches){if(!matches.length)return'<div class="empty">Todavía no hay partidos cargados.</div>';return`<div class="match-list">${matches.map(m=>{let a=participant(m.a),b=participant(m.b);return`<div class="match"><div class="match-team">${crest(a)}<span>${esc(a?.name||'Equipo pendiente')}</span></div><div class="match-score">${m.status==='played'?`${m.ga} <small>-</small> ${m.gb}`:'VS'}<br><small>${m.status==='played'?(m.default?'DEFAULT':'FINAL'):'PENDIENTE'}</small></div><div class="match-team">${crest(b)}<span>${esc(b?.name||'Equipo pendiente')}</span></div></div>`}).join('')}</div>`}function qualified(t){return['A','B','C'].map(g=>groupParticipants(t,g)[0]).filter(Boolean)}function leagueMatches(t){let q=qualified(t);return q.length<3?[]:[{id:'l1',a:q[0].id,b:q[1].id},{id:'l2',a:q[0].id,b:q[2].id},{id:'l3',a:q[1].id,b:q[2].id}].map(base=>t.leagueMatches.find(m=>m.id===base.id)||{...base,status:'pending',ga:0,gb:0})}function renderLeague(t){let q=qualified(t);if(q.length<3)return`<div class="empty"><strong>Fase 2 pendiente</strong>Se necesitan los primeros de Tabla A, B y C para formar la mini liga.</div>`;let matches=leagueMatches(t),rows=q.map(p=>{let s=stats(t,p.id);return{...p,pts:s.pts}}).sort((a,b)=>b.pts-a.pts);return`<div class="two-col"><div class="panel"><div class="panel-head"><h2>Mini Liga</h2><span class="badge">Clasifican 2</span></div><p class="phase-note">Clasificados automáticamente desde la Fase 1: primeros de las Tablas A, B y C.</p>${matchesHtml(t,matches)}</div><div class="panel"><div class="panel-head"><h2>Posiciones</h2></div>${tableHtml(t,rows)}</div></div>`}function renderFinal(t){let q=qualified(t),finalTeams=t.final.teams.length?t.final.teams:q.slice(0,2);if(finalTeams.length<2)return`<div class="empty"><strong>Final pendiente</strong>Los dos primeros de la Mini Liga aparecerán aquí automáticamente.</div>`;let wins={};(t.final.games||[]).forEach(g=>{if(g.status==='played')wins[g.ga>g.gb?g.a:g.b]=(wins[g.ga>g.gb?g.a:g.b]||0)+1});let champ=Object.keys(wins).find(id=>wins[id]>=2);return`${champ?`<div class="champion">${crest(participant(champ))}<h2>Campeón del torneo</h2><p>${esc(participant(champ)?.name)} · ${esc(participant(champ)?.course)} · ${esc(participant(champ)?.club)}</p></div>`:''}<div class="panel" style="margin-top:18px"><div class="panel-head"><h2>Final · Mejor de 3</h2><span class="badge">${champ?'Finalizada':'En disputa'}</span></div><div class="two-col"><div>${finalTeams.map(p=>`<div class="match-team" style="margin:14px 0;font-size:15px">${crest(p)}<span>${esc(p.name)}<small class="muted">${esc(p.club)}</small></span></div>`).join('')}</div><div>${matchesHtml(t,t.final.games||[])}</div></div></div>`}function bindPublic(){document.querySelectorAll('[data-tourney]').forEach(b=>b.onclick=()=>{currentTournament=b.dataset.tourney;renderPublic()});document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{publicPhase=b.dataset.phase;renderPublic()})}

grupos</h2></div>${matchesHtml(t,t.groupMatches)}</div></div>`}function bindAdmin(){document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{currentTournament=b.dataset.manage;adminSection='participants';renderAdmin()});document.querySelectorAll('[data-switch-t]').forEach(b=>b.onclick=()=>{currentTournament=b.dataset.switchT;renderAdmin()});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm('¿Reiniciar este torneo y eliminar participantes y resultados?')){data[b.dataset.reset]=emptyTournament(data[b.dataset.reset].name,data[b.dataset.reset].years);saveData();renderAdmin();toast('Torneo reiniciado')}});document.getElementById('addParticipant')?.addEventListener('click',()=>openParticipant());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openParticipant(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteParticipant(b.dataset.delete));document.getElementById('matchForm')?.addEventListener('submit',saveMatch);document.getElementById('defaultWin')?.addEventListener('change',e=>{if(e.target.checked){document.getElementById('goalsA').value=3;document.getElementById('goalsB').value=0}})}function openParticipant(id){editingId=id||null;let p=id?participant(id):{name:'',course:'',division:'',club:'',number:'',image:''};document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><h2>${id?'Editar':'Agregar'} participante</h2><form id="participantForm"><div class="form-grid"><div class="field full"><label>Nombre de la dupla</label><input id="pName" value="${esc(p.name)}" required></div><div class="field"><label>Curso</label><input id="pCourse" value="${esc(p.course)}" placeholder="Ej. 6° Año" required></div><div class="field"><label>División</label><input id="pDivision" value="${esc(p.division)}" placeholder="Ej. A"></div><div class="field"><label>Club</label><input id="pClub" value="${esc(p.club)}" placeholder="Club a definir"></div><div class="field"><label>Número sorteado</label><input id="pNumber" value="${esc(p.number)}" type="number" min="1"></div><div class="field"><label>Tabla de Fase 1</label><select id="pGroup"><option value="">Sin asignar</option>${['A','B','C'].map(g=>`<option ${groupOf(current(),p.id)===g?'selected':''} value="${g}">Tabla ${g}</option>`).join('')}</select></div><div class="field"><label>Imagen / escudo</label><input id="pImage" type="file" accept="image/png,image/jpeg,image/webp"><span class="file-note">PNG, JPG, JPEG o WEBP. Se guarda localmente.</span></div></div><div id="imagePreview">${p.image?`<img class="preview" src="${p.image}" alt="Vista previa">`:''}</div><div class="modal-foot"><button type="button" class="btn secondary" id="closeModal">Cancelar</button><button class="btn primary">Guardar participante</button></div></form></div></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('pImage').onchange=previewImage;document.getElementById('participantForm').onsubmit=saveParticipant}function previewImage(e){let file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){toast('La imagen debe pesar menos de 2 MB');return}let reader=new FileReader();reader.onload=()=>{pendingImage=reader.result;document.getElementById('imagePreview').innerHTML=`<img class="preview" src="${pendingImage}" alt="Vista previa">`};reader.readAsDataURL(file)}function saveParticipant(e){e.preventDefault();let t=current(),p=editingId?participant(editingId):{id:uid()};p.name=document.getElementById('pName').value.trim();p.course=document.getElementById('pCourse').value.trim();p.division=document.getElementById('pDivision').value.trim();p.club=document.getElementById('pClub').value.trim();p.number=document.getElementById('pNumber').value.trim();if(pendingImage)p.image=pendingImage;if(!editingId)t.participants.push(p);Object.keys(t.groups).forEach(g=>t.groups[g]=t.groups[g].filter(id=>id!==p.id));let group=document.getElementById('pGroup').value;if(group)t.groups[group].push(p.id);saveData();pendingImage='';closeModal();renderAdmin();toast('Participante guardado')}function deleteParticipant(id){if(!confirm('¿Eliminar este participante?'))return;let t=current();t.participants=t.participants.filter(p=>p.id!==id);Object.keys(t.groups).forEach(g=>t.groups[g]=t.groups[g].filter(x=>x!==id));t.groupMatches=t.groupMatches.filter(m=>m.a!==id&&m.b!==id);saveData();renderAdmin();toast('Participante eliminado')}function closeModal(){document.getElementById('modalRoot').innerHTML='';pendingImage='';editingId=null}function saveMatch(e){e.preventDefault();let t=current(),a=document.getElementById('matchA').value,b=document.getElementById('matchB').value;if(a===b){document.getElementById('matchError').textContent='Elegí dos equipos diferentes.';return}let phase=document.getElementById('matchPhase').value,m={id:uid(),a,b,ga:Number(document.getElementById('goalsA').value),gb:Number(document.getElementById('goalsB').value),status:'played',default:document.getElementById('defaultWin').checked},target=phase==='groups'?t.groupMatches:phase==='league'?t.leagueMatches:t.final.games;target.push(m);saveData();renderAdmin();toast('Resultado guardado y estadísticas actualizadas')}function toast(message){document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2800)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelectorAll('[data-open-tournament]').forEach(b=>b.onclick=()=>{currentTournament=b.dataset.openTournament;publicPhase='groups';show('tournaments')});renderHome();

function loadSports(){try{return JSON.parse(localStorage.getItem(SPORT_KEY)||'{}')}catch{return {}}}

function sportKey(){return `${activeSport} :: ${selectedDivision}`}
function sportFixture(){const key=sportKey();if(!sportsData[key])sportsData[key]={teams:[],qualified:[],matches:[]};sportsData[key].teams=Array.isArray(sportsData[key].teams)?sportsData[key].teams:[];sportsData[key].qualified=Array.isArray(sportsData[key].qualified)?sportsData[key].qualified:[];sportsData[key].matches=Array.isArray(sportsData[key].matches)?sportsData[key].matches:[];return sportsData[key]}
function saveSports(){localStorage.setItem(SPORT_KEY,JSON.stringify(sportsData))}
function sportTabs(){const divisions=sportCatalog[activeSport]||['Única'];return `<div class="tabs sport-divisions">${divisions.map(d=>`<button class="tab ${d===selectedDivision?'active':''}" data-division="${esc(d)}">${esc(d)}</button>`).join('')}</div>`}
function sportPublicContent(){const fixture=sportFixture();return `${sportTabs()}<div class="home-grid"><div class="panel"><div class="panel-head"><h2>Equipos</h2><span class="badge">${fixture.teams.length}</span></div>${fixture.teams.length?`<ol class="qualifiers">${fixture.teams.map(team=>`<li>${esc(team)}</li>`).join('')}</ol>`:'<p class="phase-note">Todavía no hay equipos publicados.</p>'}</div><div class="panel"><div class="panel-head"><h2>Clasificados</h2><span class="badge">${fixture.qualified.length}</span></div>${fixture.qualified.length?`<ol class="qualifiers">${fixture.qualified.map(team=>`<li>${esc(team)}</li>`).join('')}</ol>`:'<p class="phase-note">Todavía no hay clasificados publicados.</p>'}</div><div class="panel"><div class="panel-head"><h2>Fixture y resultados</h2><span class="badge">${fixture.matches.length} partidos</span></div>${fixture.matches.length?fixture.matches.map((match,index)=>`<div class="match"><span class="match-round">${esc(match.round||`Partido ${index+1}`)}</span><strong>${esc(match.home||'A definir')}</strong><span class="match-score">${esc(match.score||'-')}</span><strong>${esc(match.away||'A definir')}</strong></div>`).join(''):'<p class="phase-note">El fixture todavía no fue cargado.</p>'}</div></div>`}

const originalSportRender=renderPublic;renderPublic=function(){if(activeSport&&activeSport!=='FIFA'){renderSport();return}originalSportRender()};

function renderSportAdmin(){const target=document.getElementById('adminSectionContent');if(!target)return;target.innerHTML=sportAdmin();document.querySelectorAll('#adminSectionContent [data-division]').forEach(button=>button.onclick=()=>{selectedDivision=button.dataset.division;renderSportAdmin()});document.getElementById('sportForm').onsubmit=event=>{event.preventDefault();const fixture=sportFixture();fixture.teams=document.getElementById('sportTeams').value.split('\n').map(v=>v.trim()).filter(Boolean);fixture.qualified=document.getElementById('sportQualified').value.split('\n').map(v=>v.trim()).filter(Boolean);fixture.matches=document.getElementById('sportMatches').value.split('\n').map(line=>line.split('|').map(v=>v.trim())).filter(parts=>parts.filter(Boolean).length>=2).map(parts=>({round:parts[0],home:parts[1],away:parts[2]||'A definir',score:parts[3]||'-'}));saveSports();renderSportAdmin()}}
const originalRenderAdmin=renderAdmin;renderAdmin=function(){originalRenderAdmin();if(isAdmin&&adminSection==='sports')renderSportAdmin()};document.addEventListener('click',event=>{if(event.target.closest('[data-admin="sports"]')){adminSection='sports';renderAdmin()}});const adminTabObserver=new MutationObserver(()=>{const tabs=document.querySelector('#adminView .tabs');if(isAdmin&&tabs&&!tabs.querySelector('[data-admin="sports"]'))tabs.insertAdjacentHTML('beforeend','<button class="tab" data-admin="sports">Disciplinas</button>')});adminTabObserver.observe(document.body,{childList:true,subtree:true});

<script>
(() => {
  const FORMAT_KEY = 'fc26-competition-formats-v1';
  const FORMAT_SPORT_KEY = 'fc26-current-format-sport';

  function readJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (error) {
      return fallback;
    }
  }

  function writeJson(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  function ensureArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function makePhaseConfig({ name = 'Nueva fase', type = 'groups', order = 1, status = 'proxima', participants = 4, qualifiedCount = 1, zoneCount = 1, zones = [], matches = [], rules = ['Puntos', 'Diferencia de goles', 'Goles a favor'], manualEdit = false } = {}) {
    return {
      id: uid(),
      name,
      type,
      order,
      status,
      participants,
      qualifiedCount,
      zoneCount,
      zones: ensureArray(zones).map((zone, idx) => ({
        id: zone.id || `zone-${idx + 1}`,
        name: zone.name || `Zona ${String.fromCharCode(65 + idx)}`,
        participants: ensureArray(zone.participants),
        qualifiedCount: Number(zone.qualifiedCount || qualifiedCount || 1),
        qualified: ensureArray(zone.qualified)
      })),
      matches: ensureArray(matches),
      rules: ensureArray(rules),
      manualEdit
    };
  }

  function buildDefaultFormat(sportName) {
    const defaultName = sportName || 'Deporte';
    if (sportName === 'FIFA') {
      return {
        sport: 'FIFA',
        published: false,
        phases: [
          makePhaseConfig({
            name: 'Fase 1 · Grupos',
            type: 'groups',
            order: 1,
            status: 'en-curso',
            participants: 0,
            qualifiedCount: 1,
            zoneCount: 3,
            zones: [
              { name: 'Zona A', participants: [], qualifiedCount: 1, qualified: [] },
              { name: 'Zona B', participants: [], qualifiedCount: 1, qualified: [] },
              { name: 'Zona C', participants: [], qualifiedCount: 1, qualified: [] }
            ],
            rules: ['Puntos', 'Diferencia de goles', 'Goles a favor']
          }),
          makePhaseConfig({
            name: 'Fase 2 · Mini Liga',
            type: 'knockout',
            order: 2,
            status: 'proxima',
            participants: 3,
            qualifiedCount: 2,
            matches: [],
            rules: ['Puntos', 'Diferencia de goles', 'Goles a favor']
          }),
          makePhaseConfig({
            name: 'Final · Mejor de 3',
            type: 'final',
            order: 3,
            status: 'proxima',
            participants: 2,
            qualifiedCount: 1,
            matches: [],
            rules: ['Puntos', 'Diferencia de goles', 'Goles a favor']
          })
        ],
        rules: ['Puntos', 'Diferencia de goles', 'Goles a favor'],
        manualEditable: true
      };
    }
    return {
      sport: defaultName,
      published: false,
      phases: [
        makePhaseConfig({
          name: 'Fase de grupos',
          type: 'groups',
          order: 1,
          status: 'en-curso',
          participants: 8,
          qualifiedCount: 2,
          zoneCount: 2,
          zones: [
            { name: 'Zona A', participants: ['Equipo 1', 'Equipo 2', 'Equipo 3', 'Equipo 4'], qualifiedCount: 2, qualified: ['Equipo 1', 'Equipo 2'] },
            { name: 'Zona B', participants: ['Equipo 5', 'Equipo 6', 'Equipo 7', 'Equipo 8'], qualifiedCount: 2, qualified: ['Equipo 5', 'Equipo 6'] }
          ],
          rules: ['Puntos', 'Diferencia de goles', 'Goles a favor']
        }),
        makePhaseConfig({
          name: 'Semifinales',
          type: 'knockout',
          order: 2,
          status: 'proxima',
          participants: 4,
          qualifiedCount: 2,
          matches: [
            { home: '1° Zona A', away: '1° Zona B', score: '', winner: '' },
            { home: '1° Zona C', away: 'Mejor segundo', score: '', winner: '' }
          ],
          rules: ['Puntos', 'Diferencia de goles', 'Goles a favor']
        }),
        makePhaseConfig({
          name: 'Final',
          type: 'final',
          order: 3,
          status: 'proxima',
          participants: 2,
          qualifiedCount: 1,
          matches: [{ home: 'Ganador SF 1', away: 'Ganador SF 2', score: '', winner: '' }],
          rules: ['Puntos', 'Diferencia de goles', 'Goles a favor']
        })
      ],
      rules: ['Puntos', 'Diferencia de goles', 'Goles a favor'],
      manualEditable: true
    };
  }

  function buildFormatStore() {
    const store = readJson(FORMAT_KEY, {});
    const sportNames = Object.keys(sportCatalog || {});
    if (!sportNames.length) return store;
    sportNames.forEach((sportName) => {
      if (!store[sportName]) {
        store[sportName] = buildDefaultFormat(sportName);
      }
      if (sportName === 'FIFA' && store[sportName].published !== true) {
        store[sportName] = buildDefaultFormat('FIFA');
      }
    });
    writeJson(FORMAT_KEY, store);
    return store;
  }

  function getFormatStore() {
    return buildFormatStore();
  }

  function getCurrentFormatSport() {
    const store = getFormatStore();
    const sportNames = Object.keys(store || {});
    const selected = localStorage.getItem(FORMAT_SPORT_KEY) || sportNames[0] || Object.keys(sportCatalog || {})[0];
    if (store[selected]) return selected;
    return sportNames[0] || Object.keys(sportCatalog || {})[0];
  }

  function getSportFormat(sportName) {
    const store = getFormatStore();
    if (!store[sportName]) {
      store[sportName] = buildDefaultFormat(sportName);
      writeJson(FORMAT_KEY, store);
    }
    return store[sportName];
  }

  function saveSportFormat(sportName, formatConfig) {
    const store = getFormatStore();
    store[sportName] = { ...formatConfig, published: true };
    writeJson(FORMAT_KEY, store);
  }

  function sortPhases(phases) {
    return ensureArray(phases).slice().sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
  }

  function parseZoneInput(value, defaultZoneCount) {
    const lines = String(value || '').split(/\n|;/).map((line) => line.trim()).filter(Boolean);
    if (!lines.length) {
      return Array.from({ length: Number(defaultZoneCount || 1) }, (_, index) => ({
        name: `Zona ${String.fromCharCode(65 + index)}`,
        participants: [],
        qualifiedCount: 1,
        qualified: []
      }));
    }
    return lines.map((line, index) => {
      const zoneLabel = line.includes(':') ? line.split(':')[0].trim() : `Zona ${String.fromCharCode(65 + index)}`;
      const members = line.includes(':') ? line.split(':').slice(1).join(':').split(',').map(part => part.trim()).filter(Boolean) : line.split(',').map(part => part.trim()).filter(Boolean);
      return {
        id: `zone-${index + 1}`,
        name: zoneLabel || `Zona ${String.fromCharCode(65 + index)}`,
        participants: members,
        qualified: members.slice(0, 1),
        qualifiedCount: Math.min(1, Math.max(1, members.length))
      };
    });
  }

  function parseMatchInput(value) {
    return String(value || '').split(/\n|;/).map((line) => line.trim()).filter(Boolean).map((line) => {
      if (!line.includes('vs') && !line.includes('VS')) {
        const parts = line.split('|').map((part) => part.trim()).filter(Boolean);
        if (parts.length >= 2) return { home: parts[0], away: parts[1], score: parts[2] || '', winner: parts[3] || '' };
        return { home: line, away: '', score: '', winner: '' };
      }
      const normalized = line.replace(/\s+vs\s+/i, ' | ');
      const parts = normalized.split('|').map((part) => part.trim()).filter(Boolean);
      return { home: parts[0] || '', away: parts[1] || '', score: parts[2] || '', winner: parts[3] || '' };
    });
  }

  function formatPhaseForPublic(phase) {
    const phaseOrder = Number(phase.order || 0);
    if (phase.type === 'groups') {
      const zones = ensureArray(phase.zones).length ? phase.zones : [{ name: 'Zona A', participants: [], qualifiedCount: 1, qualified: [] }];
      const listMarkup = zones.map((zone) => {
        const participants = ensureArray(zone.participants).length ? zone.participants : ['Sin participantes'];
        const qualified = ensureArray(zone.qualified).length ? zone.qualified : ['Sin clasificados'];
        return `
          <div class="format-zone-panel">
            <h4>${esc(zone.name || 'Zona')}</h4>
            <div class="format-zone-list">${participants.map((team) => `<span>${esc(team)}</span>`).join('')}</div>
            <div class="format-zone-qualifiers"><strong>Clasificados:</strong> ${qualified.map((team) => `<span>${esc(team)}</span>`).join(', ') || '—'}</div>
          </div>
        `;
      }).join('');
      return `
        <div class="panel format-phase-card" data-phase-order="${phaseOrder}">
          <div class="panel-head"><div><div class="eyebrow">Fase ${phaseOrder}</div><h3>${esc(phase.name || 'Fase')}</h3></div><span class="badge">${esc(phase.type || 'groups')}</span></div>
          <div class="format-zone-grid">${listMarkup}</div>
        </div>
      `;
    }

    if (phase.type === 'knockout' || phase.type === 'final') {
      const matches = ensureArray(phase.matches);
      if (!matches.length) {
        return `
          <div class="panel format-phase-card" data-phase-order="${phaseOrder}">
            <div class="panel-head"><div><div class="eyebrow">Fase ${phaseOrder}</div><h3>${esc(phase.name || 'Eliminatoria')}</h3></div><span class="badge">${esc(phase.type || 'knockout')}</span></div>
            <p class="phase-note">Todavía no hay partidos cargados.</p>
          </div>
        `;
      }
      const matchMarkup = matches.map((match) => `
        <div class="format-match-row">
          <span>${esc(match.home || 'Equipo A')}</span>
          <b>${esc(match.score || '—')}</b>
          <span>${esc(match.away || 'Equipo B')}</span>
          ${match.winner ? `<em>→ ${esc(match.winner)}</em>` : ''}
        </div>
      `).join('');
      return `
        <div class="panel format-phase-card" data-phase-order="${phaseOrder}">
          <div class="panel-head"><div><div class="eyebrow">Fase ${phaseOrder}</div><h3>${esc(phase.name || 'Eliminatoria')}</h3></div><span class="badge">${esc(phase.type || 'knockout')}</span></div>
          <div class="format-knockout">${matchMarkup}</div>
        </div>
      `;
    }

    return `
      <div class="panel format-phase-card" data-phase-order="${phaseOrder}">
        <div class="panel-head"><div><div class="eyebrow">Fase ${phaseOrder}</div><h3>${esc(phase.name || 'Fase personalizada')}</h3></div><span class="badge">${esc(phase.type || 'custom')}</span></div>
        <p class="phase-note">Configuración personalizada disponible en el panel de administración.</p>
      </div>
    `;
  }

  function renderCompetitionPublic(sportName) {
    const format = getSportFormat(sportName);
    if (!format.published) {
      return `
        <div class="panel">
          <div class="panel-head"><div><div class="eyebrow">${esc(sportName)}</div><h2>Información pendiente</h2></div><span class="badge">Próximamente</span></div>
          <p class="phase-note">El administrador todavía no publicó información para este deporte.</p>
        </div>
      `;
    }
    const phases = sortPhases(format.phases || []);
    if (!phases.length) {
      return `
        <div class="panel">
          <div class="panel-head"><div><div class="eyebrow">Formato</div><h2>${esc(sportName)}</h2></div><span class="badge">Sin formato</span></div>
          <p class="phase-note">El administrador aún no configuró el formato de competencia para este deporte.</p>
        </div>
      `;
    }
    return `<div class="format-public-wrap">${phases.map((phase) => formatPhaseForPublic(phase)).join('')}</div>`;
  }

  function buildPhaseEditor(phase, index) {
    const groupControls = phase.type === 'groups' ? `
      <div class="field">
        <label>Cantidad de zonas</label>
        <input data-phase-field="zoneCount" value="${Number(phase.zoneCount || phase.zones?.length || 1)}" type="number" min="1">
      </div>
      <div class="field full">
        <label>Zonas (una por línea: Nombre: Equipo 1, Equipo 2, Equipo 3)</label>
        <textarea data-phase-field="zones" rows="5">${esc(ensureArray(phase.zones).length ? phase.zones.map((zone) => `${zone.name || 'Zona'}: ${ensureArray(zone.participants).join(', ')}`).join('\n') : 'Zona A: Equipo 1, Equipo 2, Equipo 3, Equipo 4\nZona B: Equipo 5, Equipo 6, Equipo 7, Equipo 8')}</textarea>
      </div>
    ` : !['knockout', 'final'].includes(phase.type) ? `
      <div class="field full">
        <label>Detalles de la fase</label>
        <textarea data-phase-field="custom" rows="4">${esc((phase.details || '').toString())}</textarea>
      </div>
    ` : `
      <div class="field full">
        <label>Cruces / partidos (una línea por partido)</label>
        <textarea data-phase-field="matches" rows="4">${esc(ensureArray(phase.matches).map((match) => `${match.home || ''} vs ${match.away || ''} | ${match.score || ''} | ${match.winner || ''}`).join('\n'))}</textarea>
      </div>
    `;

    return `
      <div class="panel format-phase-editor" data-phase-index="${index}">
        <div class="form-grid">
          <div class="field"><label>Nombre</label><input data-phase-field="name" value="${esc(phase.name || `Fase ${index + 1}`)}"></div>
          <div class="field"><label>Tipo</label><select data-phase-field="type"><option value="groups" ${phase.type === 'groups' ? 'selected' : ''}>Fase de grupos</option><option value="knockout" ${phase.type === 'knockout' ? 'selected' : ''}>Eliminación directa</option><option value="final" ${phase.type === 'final' ? 'selected' : ''}>Final</option><option value="custom" ${phase.type === 'custom' ? 'selected' : ''}>Personalizada</option></select></div>
          <div class="field"><label>Estado</label><select data-phase-field="status"><option value="proxima" ${phase.status === 'proxima' ? 'selected' : ''}>Próxima</option><option value="preparacion" ${phase.status === 'preparacion' ? 'selected' : ''}>En preparación</option><option value="en-curso" ${phase.status === 'en-curso' ? 'selected' : ''}>En curso</option><option value="finalizada" ${phase.status === 'finalizada' ? 'selected' : ''}>Finalizada</option></select></div>
          <div class="field"><label>Participantes</label><input data-phase-field="participants" type="number" min="0" value="${Number(phase.participants || 0)}"></div>
          <div class="field"><label>Clasificados</label><input data-phase-field="qualifiedCount" type="number" min="0" value="${Number(phase.qualifiedCount || 0)}"></div>
          <div class="field"><label>Orden</label><input data-phase-field="order" type="number" min="1" value="${Number(phase.order || index + 1)}"></div>
        </div>
        ${groupControls}
        <div class="small-actions" style="margin-top:16px">
          <button type="button" class="btn secondary" data-phase-action="up">↑ Subir</button>
          <button type="button" class="btn secondary" data-phase-action="down">↓ Bajar</button>
          <button type="button" class="btn danger" data-phase-action="delete">🗑 Eliminar</button>
        </div>
      </div>
    `;
  }

  function adminFormatsView() {
    const store = getFormatStore();
    const sportNames = Object.keys(sportCatalog || {});
    const selectedSport = getCurrentFormatSport();
    const format = store[selectedSport] || buildDefaultFormat(selectedSport);
    const phases = sortPhases(format.phases || []).map((phase, index) => buildPhaseEditor(phase, index)).join('');

    return `
      <div class="panel">
        <div class="panel-head">
          <div><div class="eyebrow">Configuración del formato</div><h2>Formato de competencia</h2></div>
          <span class="badge">${esc(selectedSport)}</span>
        </div>
        <div class="form-grid">
          <div class="field"><label>Deporte</label><select id="formatSportSelect">${sportNames.map((sportName) => `<option value="${esc(sportName)}" ${sportName === selectedSport ? 'selected' : ''}>${esc(sportName)}</option>`).join('')}</select></div>
          <div class="field"><label>Reglas de clasificación</label><input id="formatRulesInput" value="${esc((format.rules || ['Puntos', 'Diferencia de goles', 'Goles a favor']).join(', '))}"></div>
        </div>
        <div class="actions" style="margin-top:16px">
          <button type="button" class="btn primary" id="addFormatPhaseBtn">+ Agregar fase</button>
          <button type="button" class="btn secondary" id="saveFormatBtn">Guardar formato</button>
        </div>
        ${selectedSport === 'FIFA' ? `<div class="actions" style="margin-top:12px"><button type="button" class="btn secondary" data-fifa-admin="participants" data-fifa-tournament="t1">Gestionar Torneo 1</button><button type="button" class="btn secondary" data-fifa-admin="participants" data-fifa-tournament="t2">Gestionar Torneo 2</button><button type="button" class="btn secondary" data-fifa-admin="matches" data-fifa-tournament="t1">Resultados Torneo 1</button><button type="button" class="btn secondary" data-fifa-admin="matches" data-fifa-tournament="t2">Resultados Torneo 2</button></div>` : ''}
        <div id="formatPhasesList" style="margin-top:18px;display:grid;gap:16px">${phases || '<p class="phase-note">Todavía no hay fases configuradas.</p>'}</div>
      </div>
    `;
  }

  function bindFormatAdmin() {
    const target = document.getElementById('adminSectionContent');
    if (!target) return;

    const sportSelect = document.getElementById('formatSportSelect');
    if (sportSelect) {
      sportSelect.onchange = (event) => {
        localStorage.setItem(FORMAT_SPORT_KEY, event.target.value);
        adminSection = 'formats';
        renderAdmin();
      };
    }

    const addBtn = document.getElementById('addFormatPhaseBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const sportName = localStorage.getItem(FORMAT_SPORT_KEY) || getCurrentFormatSport();
        const current = getSportFormat(sportName);
        current.phases = ensureArray(current.phases);
        current.phases.push(makePhaseConfig({
          name: `Nueva fase ${current.phases.length + 1}`,
          type: 'groups',
          order: current.phases.length + 1,
          status: 'proxima',
          participants: 4,
          qualifiedCount: 1,
          zoneCount: 1,
          zones: [{ name: 'Zona A', participants: ['Equipo 1', 'Equipo 2', 'Equipo 3', 'Equipo 4'], qualifiedCount: 1, qualified: ['Equipo 1'] }],
          matches: [],
          rules: current.rules || ['Puntos', 'Diferencia de goles', 'Goles a favor']
        }));
        saveSportFormat(sportName, current);
        renderAdmin();
      };
    }

    const saveBtn = document.getElementById('saveFormatBtn');
    if (saveBtn) {
      saveBtn.onclick = () => {
        const sportName = document.getElementById('formatSportSelect')?.value || getCurrentFormatSport();
        const format = getSportFormat(sportName);
        const phaseCards = [...target.querySelectorAll('.format-phase-editor')];

        format.rules = String(document.getElementById('formatRulesInput')?.value || '').split(',').map((value) => value.trim()).filter(Boolean) || ['Puntos', 'Diferencia de goles', 'Goles a favor'];
        format.phases = phaseCards.map((card, index) => {
          const name = card.querySelector('[data-phase-field="name"]')?.value || `Fase ${index + 1}`;
          const type = card.querySelector('[data-phase-field="type"]')?.value || 'groups';
          const status = card.querySelector('[data-phase-field="status"]')?.value || 'proxima';
          const participants = Number(card.querySelector('[data-phase-field="participants"]')?.value || 0);
          const qualifiedCount = Number(card.querySelector('[data-phase-field="qualifiedCount"]')?.value || 0);
          const order = Number(card.querySelector('[data-phase-field="order"]')?.value || index + 1);
          const zoneCount = Number(card.querySelector('[data-phase-field="zoneCount"]')?.value || 1);
          const zonesValue = card.querySelector('[data-phase-field="zones"]')?.value || '';
          const matchesValue = card.querySelector('[data-phase-field="matches"]')?.value || '';
          const customValue = card.querySelector('[data-phase-field="custom"]')?.value || '';

          return makePhaseConfig({
            name,
            type,
            order,
            status,
            participants,
            qualifiedCount,
            zoneCount,
            zones: type === 'groups' ? parseZoneInput(zonesValue, zoneCount) : [],
            matches: type === 'groups' ? [] : parseMatchInput(matchesValue),
            rules: format.rules,
            manualEdit: true,
            details: customValue
          });
        });

        saveSportFormat(sportName, format);
        renderAdmin();
      };
    }

    target.querySelectorAll('[data-phase-action]').forEach((button) => {
      button.onclick = () => {
        const sportName = document.getElementById('formatSportSelect')?.value || getCurrentFormatSport();
        const format = getSportFormat(sportName);
        const phaseIndex = Number(button.closest('.format-phase-editor')?.dataset.phaseIndex);
        const action = button.dataset.phaseAction;

        if (Number.isNaN(phaseIndex)) return;
        const phases = sortPhases(format.phases || []);
        if (action === 'delete') {
          phases.splice(phaseIndex, 1);
          format.phases = phases.map((phase, index) => ({ ...phase, order: index + 1 }));
        }
        if (action === 'up' && phaseIndex > 0) {
          const temp = phases[phaseIndex];
          phases[phaseIndex] = phases[phaseIndex - 1];
          phases[phaseIndex - 1] = temp;
          format.phases = phases.map((phase, index) => ({ ...phase, order: index + 1 }));
        }
        if (action === 'down' && phaseIndex < phases.length - 1) {
          const temp = phases[phaseIndex];
          phases[phaseIndex] = phases[phaseIndex + 1];
          phases[phaseIndex + 1] = temp;
          format.phases = phases.map((phase, index) => ({ ...phase, order: index + 1 }));
        }

        saveSportFormat(sportName, format);
        renderAdmin();
      };
    });

    target.querySelectorAll('[data-fifa-admin]').forEach((button) => {
      button.onclick = () => {
        currentTournament = button.dataset.fifaTournament;
        target.innerHTML = button.dataset.fifaAdmin === 'participants' ? adminParticipants() : adminMatches();
        bindAdmin();
      };
    });
  }

  const originalRenderAdmin = renderAdmin;
  renderAdmin = function () {
    if (adminSection === 'participants') adminSection = 'overview';
    originalRenderAdmin();
    if (!isAdmin) return;
    const tabs = document.querySelector('.tabs');
    tabs?.querySelector('[data-admin="participants"]')?.remove();
    if (tabs && !tabs.querySelector('[data-admin="formats"]')) {
      tabs.insertAdjacentHTML('beforeend', '<button class="tab" data-admin="formats">Formatos</button>');
    }
    const currentTabs = document.querySelectorAll('[data-admin]');
    currentTabs.forEach((tab) => {
      tab.onclick = () => {
        adminSection = tab.dataset.admin;
        if (adminSection === 'formats') {
          localStorage.setItem(FORMAT_SPORT_KEY, document.getElementById('formatSportSelect')?.value || getCurrentFormatSport());
        }
        renderAdmin();
      };
    });

    if (adminSection === 'formats') {
      const target = document.getElementById('adminSectionContent');
      if (target) {
        target.innerHTML = adminFormatsView();
        bindFormatAdmin();
      }
    }
  };

  const originalRenderPublic = renderPublic;
  function renderFifaPublic() {
    const tournament = current();
    const phaseContent = publicPhase === 'groups' ? renderGroups(tournament) : publicPhase === 'league' ? renderLeague(tournament) : renderFinal(tournament);
    return `<div class="tabs"><button class="tab ${currentTournament === 't1' ? 'active' : ''}" data-tourney="t1">Torneo 1 · 1° a 3°</button><button class="tab ${currentTournament === 't2' ? 'active' : ''}" data-tourney="t2">Torneo 2 · 4° a 6°</button></div>${publicTabs()}<div id="publicPhaseContent">${phaseContent}</div>`;
  }

  renderPublic = function () {
    if (activeSport) {
      const content = document.getElementById('publicContent');
      if (content) {
        const format = getSportFormat(activeSport);
        content.innerHTML = activeSport === 'FIFA' && format.published ? renderFifaPublic() : renderCompetitionPublic(activeSport);
        if (activeSport === 'FIFA' && format.published) bindPublic();
      }
      return;
    }
    originalRenderPublic();
  };

  const originalSportRender = renderSport;
  renderSport = function () {
    const content = document.getElementById('publicContent');
    if (content && activeSport) {
      const format = getSportFormat(activeSport);
      content.innerHTML = activeSport === 'FIFA' && format.published ? renderFifaPublic() : renderCompetitionPublic(activeSport);
      if (activeSport === 'FIFA' && format.published) bindPublic();
      return;
    }
    if (originalSportRender) originalSportRender();
  };

  const originalSportAdmin = sportAdmin;
  sportAdmin = function () {
    return originalSportAdmin ? originalSportAdmin() : '';
  };

  document.addEventListener('click', (event) => {
    const formatTab = event.target.closest('[data-admin="formats"]');
    if (formatTab) {
      adminSection = 'formats';
      renderAdmin();
    }
  });

  getFormatStore();
})();
</script>
<script>
(() => {
  let fifaAdminMode = 'dashboard';
  let fifaAdminTournament = 't1';
  const baseRenderAdmin = renderAdmin;

  function fifaAdminDashboard() {
    return `<div class="panel">
      <div class="panel-head"><div><div class="eyebrow">Gestión exclusiva de FIFA</div><h2>Campeonato FIFA FC 26</h2></div><span class="badge">Solo administrador</span></div>
      <p class="phase-note">Seleccioná un torneo para administrar sus duplas, tablas, imágenes y resultados.</p>
      <div class="tournament-grid">
        <div class="panel"><div class="panel-head"><h3>Torneo 1</h3><span class="badge">1° a 3° año</span></div><div class="actions"><button class="btn primary" data-fifa-admin-mode="participants" data-fifa-tournament="t1">Participantes y tablas</button><button class="btn secondary" data-fifa-admin-mode="matches" data-fifa-tournament="t1">Resultados</button></div></div>
        <div class="panel"><div class="panel-head"><h3>Torneo 2</h3><span class="badge">4° a 6° año</span></div><div class="actions"><button class="btn primary" data-fifa-admin-mode="participants" data-fifa-tournament="t2">Participantes y tablas</button><button class="btn secondary" data-fifa-admin-mode="matches" data-fifa-tournament="t2">Resultados</button></div></div>
      </div>
      <div class="actions" style="margin-top:18px"><button class="btn secondary" data-fifa-admin-mode="formats">Configurar fases FIFA</button></div>
    </div>`;
  }

  function fifaAdminBackButton() {
    return '<div class="actions" style="margin-bottom:16px"><button type="button" class="btn secondary" data-fifa-admin-mode="dashboard">← Gestión FIFA</button></div>';
  }

  function renderFifaAdminMode() {
    baseRenderAdmin();
    if (!isAdmin) return;
    const tabs = document.querySelector('#adminView .tabs');
    if (tabs && !tabs.querySelector('[data-admin="fifaManage"]')) {
      tabs.insertAdjacentHTML('beforeend', '<button class="tab" data-admin="fifaManage">FIFA</button>');
    }
    if (fifaAdminMode === 'formats') {
      adminSection = 'formats';
      baseRenderAdmin();
      return;
    }
    const target = document.getElementById('adminSectionContent');
    if (!target) return;
    if (fifaAdminMode === 'dashboard') target.innerHTML = fifaAdminDashboard();
    if (fifaAdminMode === 'participants') {
      currentTournament = fifaAdminTournament;
      target.innerHTML = fifaAdminBackButton() + adminParticipants();
      bindAdmin();
    }
    if (fifaAdminMode === 'matches') {
      currentTournament = fifaAdminTournament;
      target.innerHTML = fifaAdminBackButton() + adminMatches();
      bindAdmin();
    }
    target.querySelectorAll('[data-fifa-admin-mode]').forEach(button => {
      button.onclick = () => {
        fifaAdminMode = button.dataset.fifaAdminMode;
        fifaAdminTournament = button.dataset.fifaTournament || fifaAdminTournament;
        if (fifaAdminMode === 'formats') {
          adminSection = 'formats';
          localStorage.setItem('fc26-current-format-sport', 'FIFA');
        } else {
          adminSection = 'overview';
        }
        renderAdmin();
      };
    });
  }

  renderAdmin = function () {
    if (isAdmin && (adminSection === 'fifaManage' || fifaAdminMode !== 'dashboard')) {
      if (adminSection === 'fifaManage') adminSection = 'overview';
      renderFifaAdminMode();
      return;
    }
    baseRenderAdmin();
    if (isAdmin) {
      const tabs = document.querySelector('#adminView .tabs');
      if (tabs && !tabs.querySelector('[data-admin="fifaManage"]')) {
        tabs.insertAdjacentHTML('beforeend', '<button class="tab" data-admin="fifaManage">FIFA</button>');
      }
      tabs?.querySelectorAll('[data-admin]:not([data-admin="fifaManage"])').forEach(tab => {
        tab.onclick = () => {
          fifaAdminMode = 'dashboard';
          adminSection = tab.dataset.admin;
          renderAdmin();
        };
      });
    }
  };

  document.addEventListener('click', event => {
    const fifaTab = event.target.closest('[data-admin="fifaManage"]');
    if (fifaTab) {
      fifaAdminMode = 'dashboard';
      adminSection = 'fifaManage';
      renderAdmin();
    }
  }, true);
  document.addEventListener('click', event => {
    const generalTab = event.target.closest('#adminView [data-admin]:not([data-admin="fifaManage"])');
    if (generalTab) fifaAdminMode = 'dashboard';
  }, true);
})();
</script>
<script>
(() => {
  const baseRenderSportAdmin = renderSportAdmin;

  renderSportAdmin = function () {
    const editableSports = Object.keys(sportCatalog).filter(sport => sport !== 'FIFA');
    if (activeSport === 'FIFA') {
      activeSport = editableSports[0] || 'Fútbol masculino';
      selectedDivision = (sportCatalog[activeSport] || ['Única'])[0];
    }
    baseRenderSportAdmin();
    if (!isAdmin) return;
    const target = document.getElementById('adminSectionContent');
    if (!target || target.querySelector('#sportAdminSelect')) return;
    const panelHead = target.querySelector('.panel-head');
    if (!panelHead) return;
    const selector = document.createElement('div');
    selector.className = 'field';
    selector.style.marginBottom = '16px';
    selector.innerHTML = `<label>Deporte</label><select id="sportAdminSelect">${editableSports.map(sport => `<option value="${esc(sport)}" ${sport === activeSport ? 'selected' : ''}>${esc(sport)}</option>`).join('')}</select>`;
    panelHead.insertAdjacentElement('afterend', selector);
    document.getElementById('sportAdminSelect').onchange = event => {
      activeSport = event.target.value;
      selectedDivision = (sportCatalog[activeSport] || ['Única'])[0];
      renderSportAdmin();
    };
  };
})();
</script>
</body></html>
